<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教室の地図・駐車場｜スマホ教室TERACO（てらこ）</title>
<meta name="description" content="スマホ教室TERACO（てらこ）の場所と駐車場のご案内。宮崎県西都市大字三宅9437-9。">
<link rel="canonical" href="https://teraco-labo.com/map.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --cream:#faf7f1; --white:#fff; --forest:#3f6b4f; --forest-dark:#325a41; --text:#2b2823; --body:#5a554c; --muted:#8a8272; --border:#eae4d8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif; background:var(--cream); color:var(--text); line-height:1.8; }
  main { max-width:560px; margin:0 auto; padding:28px 18px 48px; display:flex; flex-direction:column; gap:18px; }
  .shop { font-family:'Shippori Mincho',serif; font-size:15px; color:var(--forest); letter-spacing:.08em; }
  h1 { font-family:'Shippori Mincho',serif; font-size:26px; line-height:1.4; margin-top:-8px; }
  .addr { font-size:17px; font-weight:700; }
  .map { background:var(--white); border:1px solid var(--border); border-radius:14px; padding:10px; }
  .map img { width:100%; height:auto; display:block; border-radius:8px; }
  .note { background:var(--white); border-radius:14px; padding:16px 18px; font-size:16px; color:var(--body); }
  .note b { color:var(--text); }
  .note p + p { margin-top:8px; }
  .btn { display:flex; align-items:center; justify-content:center; min-height:60px; border-radius:99px; font-size:18px; font-weight:700; text-decoration:none; }
  .btn-map { background:var(--forest); color:var(--white); }
  .btn-tel { background:var(--white); color:var(--forest); border:2px solid var(--forest); }
  .foot { text-align:center; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <p class="shop">スマホ教室 TERACO（てらこ）</p>
  <h1>教室の地図と駐車場</h1>
  <p class="addr">宮崎県西都市大字三宅9437-9</p>

  <div class="map"><img src="images/parking-map.png" alt="教室と駐車場の地図。教室の隣が駐車場です"></div>

  <div class="note">
    <p><b>駐車場は教室の隣、砂利の空き地です。</b></p>
    <p>歩行者の安全のため、教室の正面には停めないでください。</p>
  </div>

  <a class="btn btn-map" href="https://www.google.com/maps/search/?api=1&query=%E5%AE%AE%E5%B4%8E%E7%9C%8C%E8%A5%BF%E9%83%BD%E5%B8%82%E5%A4%A7%E5%AD%97%E4%B8%89%E5%AE%859437-9" target="_blank" rel="noopener">Googleマップで道順を見る</a>
  <a class="btn btn-tel" href="tel:09067381469">電話する　090-6738-1469</a>

  <p class="foot">スマホ教室TERACO（てらこ）｜運営 TERACO.LABO</p>
</main>
</body>
</html>
