<style>
  :root{
    --cream:#FAF7F1;
    --cream-deep:#F2ECDF;

    --faint:#8A8272;

    --substack-ink:#FFFFFF;
    --line:#06C755;
    --line-ink:#FFFFFF;
    --x-bg:#000000;
    --x-fg:#FFFFFF;
    --note-bg:#FFFFFF;
    --note-fg:#14110D;
    --note-edge:#DCD5C4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --cream:#1B1A17;
      --cream-deep:#232019;
      --card:#252219;
      --green:#8FC49F;
      --ink:#F2EDE2;

      --faint:#8F8878;

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);

    font-size:17px;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
    line-break:strict;
    text-wrap:pretty;
  }
  .page{max-width:470px;margin:0 auto;padding:44px 20px 64px;}

  /* ---- 頭 ---- */
  .head{text-align:center;margin-bottom:30px;}
  .brand{
    font-size:12.5px;font-weight:700;letter-spacing:.22em;
    color:var(--green);margin:0 0 14px;
  }
  .name{
    font-size:29px;font-weight:900;letter-spacing:.02em;
    line-height:1.4;margin:0 0 12px;color:var(--ink);
  }
  .who{font-size:15.5px;color:var(--muted);margin:0;line-height:1.75;}

  /* ---- 主役：Substack ---- */
  .hero{
    display:block;text-decoration:none;
    background:var(--substack);
    border-radius:16px;
    padding:24px 24px 26px;
    box-shadow:0 4px 16px rgba(255,103,25,.24);
    transition:transform .15s ease;
  }
  .hero:hover,.hero:focus-visible{transform:translateY(-2px);outline:none;}
  .hero-top{display:flex;align-items:center;gap:11px;margin-bottom:12px;}
  .hero-mark{flex:0 0 auto;width:26px;height:26px;fill:var(--substack-ink);}
  .hero-label{
    font-size:12.5px;font-weight:700;letter-spacing:.1em;
    color:var(--substack-ink);opacity:.92;
  }
  .hero-title{
    display:block;font-size:25px;font-weight:900;line-height:1.35;
    color:var(--substack-ink);margin-bottom:8px;
  }
  .hero-desc{
    display:block;font-size:14.5px;line-height:1.7;
    color:var(--substack-ink);opacity:.95;
  }

  /* ---- 2番目：LINE ---- */
  .second{
    display:flex;align-items:center;gap:16px;
    text-decoration:none;
    background:var(--line);
    border-radius:14px;
    padding:18px 22px;
    margin-top:12px;
    box-shadow:0 3px 12px rgba(6,199,85,.2);
    transition:transform .15s ease;
  }
  .second:hover,.second:focus-visible{transform:translateY(-2px);outline:none;}
  .second-ic{flex:0 0 auto;width:40px;height:40px;fill:var(--line-ink);}
  .second-txt{flex:1 1 auto;min-width:0;}
  .second-title{display:block;font-size:19px;font-weight:900;line-height:1.4;color:var(--line-ink);}
  .second-desc{display:block;font-size:13.5px;line-height:1.6;color:var(--line-ink);opacity:.92;margin-top:2px;}

  /* ---- 公式サイト ---- */
  .site{
    display:block;text-decoration:none;margin-top:12px;
    background:var(--card);border:1.5px solid var(--green);
    border-radius:12px;
    padding:16px 20px;text-align:center;
    transition:transform .15s ease;
  }
  .site:hover,.site:focus-visible{transform:translateY(-1px);outline:none;}
  .site .s-title{display:block;font-size:17px;font-weight:700;color:var(--green);line-height:1.45;}
  .site .s-desc{display:block;font-size:13px;color:var(--muted);margin-top:2px;}

  /* ---- ほかの場所 ---- */
  .others{margin-top:34px;padding-top:24px;border-top:1px solid var(--rule);text-align:center;}
  .others-label{
    font-size:12.5px;color:var(--faint);letter-spacing:.06em;margin:0 0 16px;
  }
  .others-row{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 20px;}
  .other{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    text-decoration:none;color:var(--muted);
    transition:transform .15s ease;
  }
  .other:hover,.other:focus-visible{transform:translateY(-2px);outline:none;color:var(--ink);}
  .ic{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .ic svg{width:22px;height:22px;}
  .ic-x{background:var(--x-bg);}
  .ic-x svg{fill:var(--x-fg);}
  .ic-yt{background:#FF0000;}
  .ic-spotify{background:#1DB954;}
  .ic-ig{background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF,#515BD4);}
  .ic-note{background:var(--note-bg);box-shadow:inset 0 0 0 1px var(--note-edge);}
  .ic-note text{fill:var(--note-fg);font-family:"Zen Kaku Gothic New",sans-serif;}
  .other-label{font-size:12px;font-weight:500;line-height:1.3;}

  .foot{
    margin-top:36px;text-align:center;
    font-size:12.5px;color:var(--faint);line-height:1.8;
  }
  .foot a{color:inherit;text-decoration:none;}
