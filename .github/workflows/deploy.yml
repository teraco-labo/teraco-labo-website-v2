name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Prepare deployment
        run: |
          echo "Deploying fresh copy of all files..."
          echo "Deployment timestamp: $(date)" > deployment_info.txt
          echo "Commit SHA: ${{ github.sha }}" >> deployment_info.txt
          echo "Cache-Bust: $(date +%s)" >> deployment_info.txt
          TIMESTAMP=$(date +%s)
          echo "Added cache-busting timestamp: $TIMESTAMP"
          ls -la
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          retention-days: 1
          
      # 2026-11-24：書き出した直後は GitHub の一覧にまだ載らず「No artifacts named github-pages」で失敗したため、少し待ってから公開する
      - name: Wait for artifact to be listed
        run: sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000