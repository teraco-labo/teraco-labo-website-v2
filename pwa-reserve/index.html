<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TERACO予約</title>
<!-- LINEなどでリンクを貼ったときのプレビュー文（無いと読み込み中の「おまちください」が拾われる） 2026-09-25 -->
<meta name="description" content="スマホ教室TERACOの予約ページです。ご都合の良い日をえらんで予約できます。">
<meta property="og:title" content="TERACO予約｜スマホ教室TERACO">
<meta property="og:description" content="ご都合の良い日をえらんで予約できます。むずかしいときは教室で一緒に。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://teraco-labo.com/pwa-reserve/">
<meta name="theme-color" content="#06C755">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --green:#06C755; --green-deep:#0B7A3E; --green-weak:#E6F8EC; --line:#DCEBE1;
    --ink:#1F2A24; --sub:#5B6B60; --bg:#F5FAF6; --warn:#C0392B; --warn-weak:#FDECEA; --admin:#2B3136;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink);font-size:20px;line-height:1.6;}
  header.bar{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;text-align:center;
             font-size:24px;font-weight:800;padding:14px 12px;letter-spacing:.04em;}
  .restart{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:inherit;font-size:15px;font-weight:800;padding:8px 12px;border-radius:999px;border:2px solid #fff;background:transparent;color:#fff;}
  .restart:active{background:rgba(255,255,255,.25);}
  .band{padding:10px 14px;font-size:17px;font-weight:700;text-align:center;}
  .band.demo{background:#FFF4D6;color:#7A5B00;}
  .band.proxy{background:var(--admin);color:#fff;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .band.proxy button{font-size:15px;padding:6px 12px;border-radius:999px;border:2px solid #fff;background:transparent;color:#fff;font-weight:700;}
  main{max-width:600px;margin:0 auto;padding:18px 16px 120px;}
  h1{font-size:26px;line-height:1.4;margin:6px 0 14px;}
  h2{font-size:21px;color:var(--green-deep);margin:0 0 12px;}
  .card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 16px;margin-bottom:18px;}
  .muted{color:var(--sub);font-size:17px;}
  .center{text-align:center;}
  button{font-family:inherit;cursor:pointer;}
  .btn{display:block;width:100%;min-height:68px;padding:14px 16px;border-radius:16px;border:0;
       background:var(--green);color:#fff;font-size:23px;font-weight:800;box-shadow:0 4px 0 var(--green-deep);}
  .btn:active{transform:translateY(3px);box-shadow:none;}
  .btn:disabled{background:#C9D3CC;box-shadow:none;color:#fff;}
  .btn.ghost{background:#fff;color:var(--green-deep);border:3px solid var(--green);box-shadow:none;}
  .btn.quiet{background:#fff;color:var(--sub);border:2px solid #C9D3CC;box-shadow:none;font-size:20px;min-height:58px;}
  .btn.danger{background:var(--warn);box-shadow:0 4px 0 #8E281D;}
  .btn.dark{background:var(--admin);box-shadow:0 4px 0 #000;}
  .btn + .btn{margin-top:12px;}
  .link{background:none;border:0;color:var(--green-deep);font-size:18px;font-weight:700;text-decoration:underline;padding:10px 6px;}
  .links{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center;margin-top:6px;}
  /* 予約の行 */
  .rsv{display:flex;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line);}
  .rsv:first-of-type{border-top:0;}
  .rsv .when{flex:1;}
  .rsv .date{font-size:23px;font-weight:800;}
  .rsv .cls{font-size:16px;color:var(--sub);}
  .rsv .ops{display:flex;flex-direction:column;gap:8px;}
  .mini{min-width:104px;padding:10px 10px;border-radius:12px;border:2px solid var(--green);background:#fff;color:var(--green-deep);font-size:17px;font-weight:800;}
  .mini.del{border-color:#E0B4AE;color:var(--warn);}
  /* いつもの候補（チェック行） */
  .month-label{font-size:19px;font-weight:800;margin:14px 0 8px;}
  .pick{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:3px solid var(--line);
        border-radius:14px;padding:14px;margin-bottom:10px;font-size:22px;font-weight:800;color:var(--ink);}
  .pick .box{flex:0 0 34px;height:34px;border-radius:9px;border:3px solid #9AA8A0;background:#fff;position:relative;}
  .pick.on{border-color:var(--green);background:var(--green-weak);}
  .pick.on .box{background:var(--green);border-color:var(--green);}
  .pick.on .box::after{content:"";position:absolute;left:9px;top:3px;width:9px;height:17px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg);}
  .pick .cnt{margin-left:auto;font-size:16px;font-weight:700;color:var(--sub);}
  /* カレンダー */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-head .ttl{font-size:23px;font-weight:800;color:var(--green-deep);}
  .nav{width:56px;height:56px;border-radius:14px;border:3px solid var(--green);background:#fff;color:var(--green-deep);font-size:28px;font-weight:800;}
  .nav:disabled{border-color:#D5DDD8;color:#C3CCC6;}
  table.cal{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff;border-radius:14px;overflow:hidden;}
  table.cal th{font-size:16px;color:var(--sub);padding:8px 0;background:#EEF6F0;}
  table.cal td{height:62px;text-align:center;vertical-align:middle;font-size:21px;font-weight:800;border:1px solid #EDF3EF;position:relative;}
  td.off{color:#C5CEC8;background:#FAFBFA;font-weight:600;}
  td.ok{color:var(--ink);background:#fff;cursor:pointer;}
  td.ok::before{content:"";position:absolute;inset:5px;border:2px solid var(--green);border-radius:12px;}
  td.alt::before{border-style:dashed;border-color:#7FB58F;}
  td.view{color:var(--sub);background:#F0F5F1;cursor:pointer;}
  td.full{color:#C5CEC8;background:#FFF1EF;}
  td.mine::after{content:"";position:absolute;left:50%;bottom:6px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:var(--green-deep);}
  td.picked{background:var(--green);color:#fff;}
  td.picked::before{border-color:#fff;}
  td.hol{background:#FDECEA;color:#B5544A;}
  .tag{display:block;font-size:11px;font-weight:800;line-height:1.15;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;}
  .tag.hol{color:#B5544A;}
  .tag.ev{color:#7A5A00;background:#FFF1C2;border-radius:6px;margin:2px 4px 0;font-size:10px;}
  .daycnt{position:absolute;right:3px;top:2px;font-size:11px;font-weight:800;color:#fff;background:var(--admin);border-radius:8px;padding:1px 5px;line-height:1.3;}
  .legend{font-size:15px;color:var(--sub);margin-top:10px;line-height:1.7;}
  /* 時間ボタン */
  .times{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .time{min-height:84px;border-radius:16px;border:3px solid var(--green);background:#fff;color:var(--green-deep);font-size:27px;font-weight:800;line-height:1.2;}
  .time small{display:block;font-size:15px;font-weight:700;color:var(--sub);margin-top:2px;}
  .time.sel{background:var(--green);color:#fff;} .time.sel small{color:#fff;}
  .time:disabled{border-color:#DDE3DF;color:#B7C0BA;background:#F6F8F6;}
  .time.blocked{border-color:#E0B4AE;color:#C97B7B;background:#FBEDEB;}
  /* 下固定バー */
  .tray{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:3px solid var(--green);padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
  .tray .in{max-width:600px;margin:0 auto;}
  .tray .n{font-size:17px;font-weight:700;margin-bottom:8px;text-align:center;}
  /* 確認・完了 */
  .big{font-size:25px;font-weight:800;line-height:1.5;}
  .list-big{list-style:none;margin:12px 0 4px;}
  .list-big li{font-size:25px;font-weight:800;padding:10px 0;border-top:1px solid var(--line);}
  .list-big li:first-child{border-top:0;}
  .arrow{font-size:20px;color:var(--sub);font-weight:700;margin:4px 0;}
  .okmark{width:84px;height:84px;border-radius:50%;background:var(--green);margin:6px auto 14px;position:relative;}
  .okmark::after{content:"";position:absolute;left:30px;top:16px;width:20px;height:38px;border:solid #fff;border-width:0 8px 8px 0;transform:rotate(45deg);}
  .note{background:var(--warn-weak);color:#8E281D;border-radius:12px;padding:12px 14px;font-size:17px;font-weight:700;margin-top:10px;}
  .info{background:var(--green-weak);color:var(--green-deep);border-radius:12px;padding:12px 14px;font-size:17px;font-weight:700;margin-top:10px;}
  /* 入力 */
  input.txt{width:100%;font-size:26px;padding:16px;border:3px solid #B9C6BE;border-radius:14px;font-family:inherit;}
  input.txt:focus{outline:none;border-color:var(--green);}
  select.sel{width:100%;font-size:24px;padding:14px 16px;border:3px solid var(--admin);border-radius:14px;font-family:inherit;background:#fff;color:#1F2A24;}
  .choice{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--green);border-radius:16px;padding:18px 16px;margin-bottom:12px;color:var(--ink);}
  .choice b{display:block;font-size:25px;color:var(--green-deep);}
  .choice span{font-size:17px;color:var(--sub);font-weight:700;}
  .names{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
  .names button{font-size:20px;font-weight:800;padding:12px 16px;border-radius:12px;border:2px solid var(--admin);background:#fff;color:var(--admin);}
  .sum-day{font-weight:800;margin:12px 0 6px;}
  .sum-row{display:flex;gap:10px;font-size:18px;padding:6px 0;border-top:1px solid var(--line);}
  .sum-row .t{flex:0 0 64px;font-weight:800;}
  /* 読み込み */
  #busy{position:fixed;inset:0;z-index:100;background:rgba(255,255,255,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:22px;font-weight:800;color:var(--green-deep);}
  #busy.on{display:flex;}
  .spin{width:56px;height:56px;border:6px solid var(--green-weak);border-top-color:var(--green);border-radius:50%;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .sync{font-size:15px;color:var(--sub);text-align:center;margin:-6px 0 12px;min-height:22px;}
</style>
</head>
<body>
<header class="bar">TERACO予約<button class="restart" data-act="restart">最初から</button></header>
<div id="bands"></div>
<main id="app"></main>
<div id="tray"></div>
<div id="busy"><div class="spin"></div><div id="busyText">おまちください</div></div>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="line-config.js?v=3"></script>
<script src="timetable.js?v=1"></script>
<script src="app.js?v=n25"></script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }</script>
</body>
</html>
